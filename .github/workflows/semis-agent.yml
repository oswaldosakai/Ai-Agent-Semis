name: Semis Factor Analysis

on:
  schedule:
    - cron: '0 6,12,18,0 * * *'   # runs at 06:00, 12:00, 18:00, 00:00 UTC
  workflow_dispatch:                # also allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/happy-hamilton-0ql8hu

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python agent/main.py --run-now

      - name: Commit report
        run: |
          git config user.name "semis-agent[bot]"
          git config user.email "semis-agent@users.noreply.github.com"
          git add data/reports/ data/factor_history.db || true
          git diff --cached --quiet || git commit -m "chore: update semis analysis report $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin claude/happy-hamilton-0ql8hu
